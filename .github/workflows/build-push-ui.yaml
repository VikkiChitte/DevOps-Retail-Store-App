name: Build and Push UI Service to ECR

on:
  push:
    branches:
      - main
      #- feature/vikrant
    paths:
        - "Code-Backup-1.3.0/retail-store-sample-app-1.3.0/src/ui/**"
        - ".github/workflows/build-push-ui.yaml"

permissions:
  contents: read # Needed to push commits
  id-token: write # Needed for OIDC

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: retail-ecr-ui-repo

jobs:
  build-and-push-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::799637010569:role/github-actions-oidc-role-ui3
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Define image tags
        id: vars
        run: |
          SHA_TAG=sha-${GITHUB_SHA::7}
          IMAGE_BASE="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}"
          echo "image_base=$IMAGE_BASE" >> $GITHUB_OUTPUT  
          echo "IMAGE_BASE=$IMAGE_BASE" >> $GITHUB_ENV
          echo "TAGS=latest $SHA_TAG" >> $GITHUB_ENV
          echo "Using tags: latest, $SHA_TAG"
          echo "latest = convenience tag for development and testing"
          echo "$SHA_TAG = unique tag for each commit, used for production deployments"

      - name: Build and push Docker image to Amazon ECR
        run: |
          for tag in $TAGS; do
            IMAGE_URI="${IMAGE_BASE}:${tag}"
            echo "Building and pushing $IMAGE_URI"
            docker build -t "$IMAGE_URI" Code-Backup-1.3.0/retail-store-sample-app-1.3.0/src/ui
            docker push "$IMAGE_URI"
          done
#Check
  updateK8s:
    runs-on: ubuntu-latest

    needs: build-and-push-ui

    permissions:
      contents: read # Needed to push commits
      id-token: write # Needed for OIDC

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::799637010569:role/github-actions-oidc-role-ui3
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Update tag in k8s deployment file
        run: |
          SHA_TAG=sha-${GITHUB_SHA::7}
          sed -i "s|image: .*|image: ${{ needs.build-and-push-ui.outputs.image_base }}:$SHA_TAG|" /k8s/base/ui/ui-manifest/03_ui_deployment.yaml
      
      - name: Commit and push changes
        run: |
          git config --global user.name "VikkiChitte"
          git config --global user.email "vicky12chitte@gmail.com"
          git add /k8s/base/ui/ui-manifest/03_ui_deployment.yaml
          git commit -m "Update UI image tag to $SHA_TAG"
          git push origin main

